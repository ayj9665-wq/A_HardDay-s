[package]
name = "a-hard-days"
version = "0.1.0"
description = "A task-focused desktop clock"
authors = ["A Hard Day's"]
edition = "2021"

[lib]
name = "a_hard_days_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what lets the transparent window in tauri.conf.json
# actually be transparent on macOS. Dropping it silently loses "clear" mode there.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = [
  "block2",
  "NSArray",
  "NSEnumerator",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSURL",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
